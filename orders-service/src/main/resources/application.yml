server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: orders-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5443}/${DB_NAME:orders_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# URL de inventory-service, de donde se obtiene el precio real de cada producto
inventory:
  base-url: ${INVENTORY_URL:http://localhost:8082}
