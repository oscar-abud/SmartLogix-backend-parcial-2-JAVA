server:
  port: ${SERVER_PORT:3002}
  forward-headers-strategy: framework

spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:inventory_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# Solo valida tokens: debe compartir el secreto con users-service.
jwt:
  secret: ${JWT_SECRET:smartlogix-dev-secret-cambiar-en-produccion-minimo-32-bytes}
  issuer: smartlogix-users
