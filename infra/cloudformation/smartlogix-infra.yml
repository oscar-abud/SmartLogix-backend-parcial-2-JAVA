          integration.request.path.proxy: method.request.path.proxy
          integration.request.header.Authorization: method.request.header.Authorization
          integration.request.header.X-User-Role: context.authorizer.rol
          integration.request.header.X-User-Id: context.authorizer.uid

  OrdersOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref OrdersResource
      HttpMethod: OPTIONS
      # Critico: el preflight NO puede exigir token. Si llevara el authorizer,
      # el navegador recibiria 401 en el OPTIONS y nunca enviaria la peticion real.
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: "200"
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key'"
              method.response.header.Access-Control-Allow-Methods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
              method.response.header.Access-Control-Max-Age: "'3600'"
      MethodResponses:
        - StatusCode: "200"
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Max-Age: true

  OrdersProxyOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref OrdersProxyResource
      HttpMethod: OPTIONS
      # Critico: el preflight NO puede exigir token. Si llevara el authorizer,
      # el navegador recibiria 401 en el OPTIONS y nunca enviaria la peticion real.
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: "200"
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key'"
              method.response.header.Access-Control-Allow-Methods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
              method.response.header.Access-Control-Max-Age: "'3600'"
      MethodResponses:
        - StatusCode: "200"
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Max-Age: true

  # ---------------------------------------------------------------------
  # Respuestas de error del propio Gateway.
  # Sin esto, un 401 del authorizer llega al navegador SIN cabeceras CORS y el
  # frontend ve un error de CORS confuso en vez del 401 real.
  # ---------------------------------------------------------------------
  UnauthorizedGatewayResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref RestApi
      ResponseType: UNAUTHORIZED
      StatusCode: "401"
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
      ResponseTemplates:
        application/json: '{"status":401,"error":"Unauthorized","message":"Token JWT ausente, invalido o expirado"}'

  AccessDeniedGatewayResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref RestApi
      ResponseType: ACCESS_DENIED
      StatusCode: "403"
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
      ResponseTemplates:
        application/json: '{"status":403,"error":"Forbidden","message":"Acceso denegado por la politica del API Gateway"}'

  Default4xxGatewayResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref RestApi
      ResponseType: DEFAULT_4XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"

  Default5xxGatewayResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref RestApi
      ResponseType: DEFAULT_5XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"

  # ---------------------------------------------------------------------
  # Despliegue y stage
  # ---------------------------------------------------------------------
  Deployment:
    Type: AWS::ApiGateway::Deployment
    # Sin DependsOn, CloudFormation puede desplegar antes de crear los metodos
    # y publicar una API vacia.
    DependsOn:
      - AuthMethod
      - AuthProxyMethod
      - UsersMethod
      - UsersProxyMethod
      - ProductsMethod
      - ProductsProxyMethod
      - CategoriesMethod
      - CategoriesProxyMethod
      - OrdersMethod
      - OrdersProxyMethod
    Properties:
      RestApiId: !Ref RestApi
      Description: !Sub "Despliegue del pipeline CI/CD - ${DeploymentNonce}"

  Stage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref RestApi
      DeploymentId: !Ref Deployment
      StageName: !Ref StageName
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          # Limites de peticiones: el equivalente practico al "breaker" del diagrama,
          # protege a las EC2 de una avalancha de trafico.
          ThrottlingRateLimit: 50
          ThrottlingBurstLimit: 100
          MetricsEnabled: true

# ===========================================================================
# SALIDAS
# ===========================================================================
Outputs:

  ApiUrl:
    Description: URL base del API Gateway. Es el unico punto de entrada publico.
    Value: !Sub "https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}"
    Export:
      Name: SmartLogixApiUrl

  ShippingQueueUrl:
    Description: URL de la cola SQS. Hay que pasarla a orders-service como SQS_QUEUE_URL.
    Value: !Ref ShippingQueue
    Export:
      Name: SmartLogixShippingQueueUrl

  ShippingQueueArn:
    Value: !GetAtt ShippingQueue.Arn

  ShippingDlqUrl:
    Description: Cola de mensajes fallidos, para inspeccionar errores de la Lambda.
    Value: !Ref ShippingDlq

  JwtAuthorizerFunctionName:
    Value: !Ref JwtAuthorizerFunction

  ShippingFunctionName:
    Value: !Ref ShippingFunction
